name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/stockpulse-mvp
  # 다른 워크플로(collect-prices)가 호출할 수 있게 한다.
  # GITHUB_TOKEN으로 push한 커밋은 push 이벤트를 트리거하지 않으므로,
  # 데이터 갱신 후에는 이 경로로 배포를 이어붙여야 한다.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockpulse

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 브랜치 HEAD를 받는다. 호출 워크플로가 방금 데이터를 커밋한 경우
          # 기본값(caller의 SHA)으로는 이전 데이터를 빌드하게 된다.
          ref: ${{ github.ref }}

      - name: pnpm 설치
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: stockpulse/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 정적 빌드
        env:
          GITHUB_PAGES: 'true'
          # 저장소 이름이 바뀌면 이 값도 함께 바꿔야 한다
          PAGES_BASE_PATH: /trading-diary
        run: pnpm build

      # Jekyll이 _next 디렉터리를 무시하는 것을 막는다 (밑줄 시작 경로 문제)
      - name: .nojekyll 추가
        run: touch out/.nojekyll

      - name: Pages 설정 로드
        uses: actions/configure-pages@v5

      - name: 산출물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: stockpulse/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
